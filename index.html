<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="grid-container">
        <img src="images/jasper-gribble-TTExgxV06KA-unsplash.jpg"
        class="img1" 
        alt="A foggy beach with a large rock formation in the foreground">
        <img src="images/pawel-czerwinski-Wuu6H3mI7UA-unsplash.jpg"
        class="img2" 
        alt="A living room with a white couch and a round window">
        <img src="images/premium_photo-1695582868702-5b0f91584d00.jpg"
        class="img3" 
        alt="A table topped with plates and bowls of food">
        <img src="images/bernhard-uTd-kylh7bE-unsplash.jpg"
        class="img4" 
        alt="A building with a red door and a tree in front of it">
        <img src="images/florian-schmid-f1PzRPbqt0M-unsplash.jpg"
        class="img5" 
        alt="A row of white apartment buildings next to a street">
        <img src="images/premium_photo-1724863374168-cc3334387b81.jpg"
        class="img6" 
        alt="A view of a beach from the top of a hill">
    </main>
</body>
</html>
